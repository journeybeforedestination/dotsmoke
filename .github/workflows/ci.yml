name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The integration tests drive a real launcher against a public sandbox. Nightly is
  # often enough to learn that either has broken, and rare enough that a red run is
  # signal rather than noise on someone's branch.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Format, analyzers, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore the pinned formatter
        run: dotnet tool restore

      # Cheapest gate here: no network, no container, under a second.
      - name: Check formatting
        run: dotnet csharpier check .

      # --locked-mode refuses to resolve anything the lock files do not already name.
      # This step is also where a newly published advisory surfaces, as NU1901-1904.
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -warnaserror

      # A model edited without `dotnet ef migrations add` would be green here for the
      # wrong reason: the app migrates at start-up, so it starts cleanly against a schema
      # that is missing the change and fails at the first query instead. This exits
      # non-zero when the two have drifted apart.
      - name: Check the migrations still match the model
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/SmartOnFhirDemo --no-build

      # Both projects. Twenty-seven of the integration tests need no launcher — among
      # them every untrusted-issuer refusal — and the nineteen that do skip themselves.
      - name: Test
        run: >
          dotnet test --no-build
          --coverage --coverage-settings coverage.config
          --coverage-output-format cobertura

      # Reported, not gated. This job runs offline, so the launcher-bound tests skip and
      # the number is structurally below what the suite actually reaches — a floor set
      # against it would enshrine a figure the tests beat by construction. The nightly
      # job runs all of them, and that is where a floor can mean something.
      - name: Report coverage
        run: ./.github/coverage.sh

  publish:
    name: Publish the image
    # Merges only. A pull request from a fork could not be given packages: write anyway,
    # and an image per branch would be noise in a registry the deploy reads by commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Widened from the file-level contents: read, and only here.
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # the short-lived certificate the attestation is signed with
      attestations: write # file the attestation against this repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # Writes a credential file, and nothing else: the SDK builds and pushes the image
      # itself, so no daemon runs in this job. Docker would only be needed to *run* one.
      - name: Sign in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          echo "$REGISTRY_TOKEN"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # No Dockerfile: the base image, the port and the rootless user are all inferred
      # from the project, which is one fewer place the runtime version is pinned.
      #
      # Tagged with the commit and never `latest`, because the deploy names an exact image
      # and a moving tag is the one thing a rollback cannot use. RestoreLockedMode keeps
      # the guarantee the build job's --locked-mode gives; publish restores again for the
      # linux-x64 RID, and would otherwise be free to resolve something else.
      #
      # The digest comes out of the same run that pushed. It has to: the image is not
      # byte-reproducible, so a second build would name different bytes.
      - name: Publish the image
        id: image
        run: |
          dotnet publish src/SmartOnFhirDemo --os linux --arch x64 /t:PublishContainer \
            -p RestoreLockedMode=true \
            -p ContainerRegistry=ghcr.io \
            -p ContainerImageTag=${{ github.sha }} \
            --getProperty:GeneratedContainerDigest \
            --getResultOutputFile:digest.txt
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      # Signed provenance: what built this image, from which commit, with which workflow.
      # Named by digest rather than by tag — the tag is a label that can move, and the
      # attestation is about the bytes. It is filed against this repository rather than
      # pushed to the registry, so it is verified through GitHub:
      #
      #   gh attestation verify oci://ghcr.io/journeybeforedestination/dotsmoke:<sha> \
      #     --repo journeybeforedestination/dotsmoke
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/journeybeforedestination/dotsmoke
          subject-digest: ${{ steps.image.outputs.digest }}

  integration:
    name: Integration tests against a live launcher
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMART_LAUNCHER_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # Pinned by digest because the launcher publishes only a `latest` tag.
      - name: Start the SMART App Launcher
        run: |
          docker run -d --name smart-launcher -p 8080:80 \
            smartonfhir/smart-launcher-2@sha256:72bd3e3c682ce4c74e6dddb605d89acad7c8aae446ae38079e8dfe8455b84793

      # Without this the job would pass while testing nothing: the launcher-bound
      # tests carry SkipUnless and quietly skip when SMART_LAUNCHER_URL answers
      # nothing. Fail here instead, where the cause is legible.
      - name: Wait for the launcher
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$SMART_LAUNCHER_URL/v/r4/fhir/Patient?_count=1" >/dev/null; then
              echo "Launcher is answering."
              exit 0
            fi
            sleep 2
          done
          echo "::error::No launcher at $SMART_LAUNCHER_URL after 60s"
          docker logs smart-launcher || true
          exit 1

      - name: Restore the pinned tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test --no-build
          --coverage --coverage-settings coverage.config
          --coverage-output-format cobertura

      # This job runs the whole suite, so unlike the pull-request one its number means
      # something and can be held to. The floor is under the measured rate rather than
      # at it: this job reaches a public sandbox that can be reseeded, and a patient
      # arriving without a phone number should not read as a regression.
      #
      # Measured 97.2% on 2026-08-31. Raise this when it has comfortably moved up.
      - name: Report coverage
        run: ./.github/coverage.sh 93
